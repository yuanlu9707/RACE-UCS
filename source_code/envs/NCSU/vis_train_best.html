    const bounds = [[35.7651, -78.6988], [35.7896, -78.6628]];
    const map = L.map('map', { preferCanvas: true });
    const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20, subdomains: 'abcd', attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    });
    L.control.layers({'街道地图': streets, '浅色地图': light}, null, {position: 'topleft'}).addTo(map);
    L.control.scale({imperial: false}).addTo(map);
    L.rectangle(bounds, {color: '#2863ae', weight: 2, fill: false, dashArray: '6 5', interactive: false}).addTo(map);
    map.fitBounds(bounds, {padding: [20, 20]});

    const canvas = L.canvas({padding: 0.2});
    const allLayer = L.layerGroup();
    const currentLayer = L.layerGroup().addTo(map);
    for (const slot of pointsBySlot) {
      for (const [lat, lon] of slot) {
        L.circleMarker([lat, lon], {
          renderer: canvas, radius: 1.7, color: '#000', weight: 0,
          fillColor: '#000', fillOpacity: 0.95, interactive: false
        }).addTo(allLayer);
      }
    }
    allLayer.addTo(map);

    const range = document.getElementById('slot-range');
    const label = document.getElementById('slot-label');
    const showAll = document.getElementById('show-all');
    const play = document.getElementById('play');
    let timer = null;
    function drawSlot() {
      const slotNumber = Number(range.value);
      label.textContent = `第 ${slotNumber} / ${pointsBySlot.length} 时隙`;
      currentLayer.clearLayers();
      for (const [lat, lon, userId] of pointsBySlot[slotNumber - 1]) {
        L.circleMarker([lat, lon], {
          renderer: canvas, radius: 4, color: '#000', weight: 0,
          fillColor: '#000', fillOpacity: 1
        }).bindTooltip(`用户 ${userId + 1} · 时隙 ${slotNumber}`).addTo(currentLayer);
      }
    }
    function setAllVisibility() {
      if (showAll.checked) allLayer.addTo(map);
      else map.removeLayer(allLayer);
    }
    function stopPlayback() {
      if (timer) clearInterval(timer);
      timer = null;
      play.textContent = '播放';
    }
    range.addEventListener('input', drawSlot);
    showAll.addEventListener('change', setAllVisibility);
    play.addEventListener('click', () => {
      if (timer) { stopPlayback(); return; }
      showAll.checked = false;
      setAllVisibility();
      play.textContent = '暂停';
      timer = setInterval(() => {
        range.value = Number(range.value) < pointsBySlot.length ? Number(range.value) + 1 : 1;
        drawSlot();
      }, 350);
    });
    drawSlot();
  </script>
